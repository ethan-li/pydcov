name: CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # macOS doesn't have gcc in the default environment
          - os: macos-latest
            compiler: gcc

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          clang \
          llvm \
          cmake \
          lcov \
          python3-pip

    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Xcode command line tools are pre-installed on GitHub Actions macOS runners
        # Install Homebrew packages
        brew install llvm lcov

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-html coverage build wheel

    - name: Set up environment variables
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # On Ubuntu, LLVM tools might be versioned (e.g., llvm-profdata-14)
            # Try to find the correct version and create symlinks if needed
            LLVM_VERSION=$(clang --version | grep -oP 'clang version \K[0-9]+' | head -1)
            if [ -n "$LLVM_VERSION" ]; then
              echo "LLVM_VERSION=$LLVM_VERSION" >> $GITHUB_ENV
            fi
          fi
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        fi

        # Set coverage environment for Clang
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "LLVM_PROFILE_FILE=build/coverage-%p.profraw" >> $GITHUB_ENV
        fi

    - name: Build project
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make

    - name: Test PyDCov package installation
      run: |
        # Build and install PyDCov package
        python -m build --wheel
        pip install dist/*.whl

        # Verify installation
        pydcov --version
        python -c "import pydcov; print('PyDCov package imported successfully')"

    - name: Run PyDCov package tests
      run: |
        # Test package functionality
        python -m pytest tests/test_package_installation.py -v --tb=short
        python -m pytest tests/test_cli_commands.py -v --tb=short
        python -m pytest tests/test_template_system.py -v --tb=short

    - name: Run integration tests
      run: |
        # Test integration scenarios (marked as slow)
        python -m pytest tests/test_integration.py -v --tb=short --run-slow

    - name: Run example module tests
      run: |
        # Test the example C/C++ modules
        python -m pytest examples/algorithm/tests/ examples/statistics/tests/ -v --tb=short

    - name: Build with coverage
      run: |
        rm -rf build
        mkdir -p build
        cd build
        # Force specific compiler for coverage
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          CC=gcc CXX=g++ cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
        else
          CC=clang CXX=clang++ cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
        fi
        make

    - name: Test CMake integration with coverage build
      run: |
        # Test that CMake integration works with coverage
        mkdir coverage_test_project
        cd coverage_test_project
        pydcov init-cmake

        # Create a simple test project
        echo 'cmake_minimum_required(VERSION 3.10)' > CMakeLists.txt
        echo 'project(TestProject)' >> CMakeLists.txt
        echo 'include(cmake/coverage.cmake)' >> CMakeLists.txt
        echo 'add_executable(test_app main.cpp)' >> CMakeLists.txt

        echo '#include <iostream>' > main.cpp
        echo 'int main() {' >> main.cpp
        echo '    std::cout << "Hello, World!" << std::endl;' >> main.cpp
        echo '    return 0;' >> main.cpp
        echo '}' >> main.cpp

        mkdir build && cd build

        # Try to configure with coverage (might fail due to missing tools)
        if cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug; then
          make
          echo "Coverage build successful"
        else
          echo "Coverage build failed (likely due to missing coverage tools)"
          # Try regular build instead
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make
        fi
        cd ../..

    - name: Run tests with coverage
      run: |
        # Initialize incremental coverage (specify build directory)
        pydcov init --build-root build

        # Add coverage data from test runs (no --build-root needed after init)
        pydcov add python -m pytest examples/algorithm/tests/ -v --tb=short
        pydcov add python -m pytest examples/statistics/tests/ -v --tb=short

    - name: Generate coverage report
      run: |
        # Merge coverage data before generating report (no --build-root needed after init)
        pydcov merge
        pydcov report

    - name: Export coverage data for external tools
      run: |
        # Export coverage data to lcov format for Codecov (no --build-root needed after init)
        pydcov export --format lcov

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v4
      with:
        file: build/coverage/incremental_merged.info
        flags: unittests
        name: codecov-umbrella-${{ matrix.compiler }}
        fail_ci_if_error: false

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build/coverage/
          !build/coverage/*.profraw
        retention-days: 7

  package-test:
    name: Test PyDCov Package Distribution
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel pytest

    - name: Build wheel
      run: |
        python -m build --wheel
        ls -la dist/

    - name: Test wheel installation
      run: |
        # Install from wheel
        pip install dist/*.whl

        # Test basic functionality
        pydcov --version
        pydcov --help

        # Test imports
        python -c "import pydcov; print('Package imported successfully')"
        python -c "from pydcov import IncrementalCoverageManager; print('Core classes imported')"

    - name: Test CMake integration
      run: |
        # Test CMake integration system
        mkdir test_wheel_project
        cd test_wheel_project
        pydcov init-cmake
        ls -la

        # Verify CMake integration structure
        test -d cmake
        test -f cmake/coverage.cmake

    - name: Test CMake integration
      run: |
        mkdir test_cmake_integration
        pydcov init-cmake --project-root test_cmake_integration
        test -f test_cmake_integration/cmake/coverage.cmake

  pyinstaller-build:
    name: Build Standalone Executables
    runs-on: ${{ matrix.os }}
    needs: [test, package-test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-name: pydcov-linux-x64
            executable-name: pydcov
          - os: macos-latest
            artifact-name: pydcov-macos-arm64
            executable-name: pydcov

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build standalone executable
      run: |
        pyinstaller pydcov.spec

    - name: Test standalone executable
      run: |
        # Test basic functionality
        ./dist/pydcov --version
        ./dist/pydcov --help

        # Test CMake integration in a temporary directory
        mkdir -p /tmp/test_standalone
        cd /tmp/test_standalone
        ${{ github.workspace }}/dist/pydcov init-cmake
        test -f cmake/coverage.cmake
        cd ${{ github.workspace }}
        rm -rf /tmp/test_standalone

    - name: Upload standalone executable
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: dist/pydcov
        retention-days: 30

  package:
    name: Package Deliverable Files
    runs-on: ubuntu-latest
    needs: [test, package-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel pyinstaller

    - name: Build PyDCov wheel
      run: |
        python -m build --wheel

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: pydcov-deliverable-package
        path: dist/*.whl
        retention-days: 7

  pypi_publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: [test, package]
    environment: 
      name: release
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download deliverable package
      uses: actions/download-artifact@v4
      with:
        name: pydcov-deliverable-package
        path: dist/pypi/

    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, pyinstaller-build]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Linux standalone executable
      uses: actions/download-artifact@v4
      with:
        name: pydcov-linux-x64
        path: dist/executables/linux/

    - name: Download macOS standalone executable
      uses: actions/download-artifact@v4
      with:
        name: pydcov-macos-arm64
        path: dist/executables/macos/

    - name: Rename executables for clarity
      run: |
        mkdir -p dist/executables
        mv dist/executables/linux/pydcov dist/executables/pydcov-linux-x64
        mv dist/executables/macos/pydcov dist/executables/pydcov-macos-arm64
        rmdir dist/executables/linux dist/executables/macos

    - name: Download wheel package
      uses: actions/download-artifact@v4
      with:
        name: pydcov-deliverable-package
        path: dist/pypi/

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        draft: false
        prerelease: false
        files: |
          dist/pypi/*.whl
          dist/executables/*.*
