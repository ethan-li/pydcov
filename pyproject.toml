[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydcov"
version = "1.0.5"
description = "Incremental C/C++ code coverage tools for CMake projects"
readme = "README_PACKAGE.md"
license = "MIT"
authors = [
    {name = "Ethan Li"}
]
maintainers = [
    {name = "Ethan Li"}
]
keywords = [
    "coverage", "incremental", "c", "cpp", "cmake", "testing", "gcov", "llvm-cov"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    # All dependencies are standard library
]

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
    "pytest>=6.0.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/ethan-li/pydcov"
Documentation = "https://github.com/ethan-li/pydcov/blob/main/README.md"
Repository = "https://github.com/ethan-li/pydcov.git"
"Bug Tracker" = "https://github.com/ethan-li/pydcov/issues"

[project.scripts]
pydcov = "pydcov.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pydcov*"]

[tool.setuptools.package-data]
pydcov = ["cmake/*.cmake"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
